# ============================================================
# 技能说明文件 — skill-compat-checker
# ============================================================
name: skill-compat-checker
display_name: 跨平台兼容检查器
version: "1.0.0"
category: 开发工具 / 质量保障
language: zh-CN / en

# 一句话简介
description: >-
  在技能发布或安装前做一次静态跨平台体检：检出已知的平台分歧
  坑（文件覆写 API 不一致、references 相对路径失效、提问工具
  3×4 上限、缺失工具静默降级、POSIX 语法、描述模糊），每条
  附具体修复建议，让技能在各平台表现一致。

# 解决了什么问题
problem_solved: >-
  智能体平台的差异行为没有任何官方文档，全部靠用户踩坑发现：
  同一句"创建文件"指令在桌面端静默覆写、在网页端拒绝覆写；
  官方推荐的 references/ 相对路径在任何平台都解析失败；要求
  提问超过 3 个问题会被静默压缩、无任何报错；引用平台不存在的
  工具时静默退化为纯文本、技能"看起来跑成功了"实际跳过了步骤。
  本技能把这些散落在社区踩坑帖里的知识编码成自动化检查，
  在发布前拦截，而不是让每个用户在生产环境里重新发现。

# 能为用户做什么
capabilities:
  - 六大类静态检查（P1–P6），每条 finding 附文件、行号和
    精确修复方案：
    · P1 相对/个人绝对路径 → 改为"从本技能目录加载 + 文件名"
    · P2 Write/create_file 分歧 → 补充平台分支指引
    · P3 提问超限（>3问 / >4选项）→ 拆分成多轮收集
    · P4 工具无回退条款 → 补"不可用即停下告知，不得凭记忆硬答"
    · P5 POSIX 专属语法 → 提供 bash / PowerShell 双变体
    · P6 description 模糊 → 重写为含触发词的第三人称描述
  - 生成兼容性清单：修复后复扫清零，再附"已测平台与已知限制"
    段落写入 SKILL.md，避免用户在生产环境重新踩坑
  - 支持 text / json 两种输出，可集成进发布流水线做门禁

# 典型使用场景
when_to_use:
  - 新技能写完、发布之前
  - 技能在 A 平台正常、在 B 平台行为异常时
  - 用户反馈"这个技能换个平台就不好使"时

# 包内资源
resources:
  - SKILL.md                       # 技能主文件
  - references/pitfalls.md         # 完整坑目录：错误写法 vs 正确写法对照
  - scripts/compat_scan.py         # 静态扫描器（支持 text/json 输出）

target_users:
  - 技能作者（发布前自查）
  - 技能市场/团队仓库的发布门禁
  - 跨平台使用技能的最终用户（安装前快检）
