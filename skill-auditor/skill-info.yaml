# ============================================================
# 技能说明文件 — skill-auditor
# ============================================================
name: skill-auditor
display_name: Skill 质量尽调官
version: "1.0.0"
category: 安全审计 / 质量评估
language: zh-CN / en

# 一句话简介
description: >-
  在安装任何第三方 AI 技能（SKILL.md 包）之前做一次快速尽调：
  自动扫描危险操作、密钥泄漏、维护停滞与元数据质量问题，
  结合人工复核给出"装 / 谨慎装 / 拒装"的结构化判定报告。

# 解决了什么问题
problem_solved: >-
  "GitHub 上有几千个 SKILL.md，好的可能不到 100 个"——数量
  不等于质量，stars 不代表安全，市场缺乏统一审核。用户面对
  陌生技能的四大犹豫：质量不确定、担心它乱改代码库或外发数据、
  维护状态不明、无法快速判断是否名副其实。本技能把数小时的人工
  审查压缩为几分钟的"自动扫描 + 结构化复核"，并要求给出可证伪
  的判定依据，而非凭感觉推荐。

# 能为用户做什么
capabilities:
  - 自动危险模式扫描：eval/exec 执行、下载后执行链、凭证路径
    （~/.ssh、.aws、.env）+ 网络外发的最高嫌疑组合、base64 混淆
    载荷、递归删除命令等，全部静态检测、绝不执行被审脚本
  - 元数据与质量检查：frontmatter 完整性、description 是否具体
    到可触发、SKILL.md 是否残留 TODO 脚手架、引用的资源是否真实
    存在、体积是否符合渐进披露原则
  - 维护状态检查：全目录最近修改时间超过一年标记"停滞"
  - 结构化判定输出：install / install-with-caution / reject 三级
    结论 + 风险等级 + 类别 + 人工复核要点 + "什么证据会改变判定"
    （可证伪，不拍脑袋）
  - 安装后建议：给出精确安装命令、版本钉住与运行护栏建议
    （如首次禁网试运行）

# 典型使用场景
when_to_use:
  - 从 GitHub / 技能市场发现一个新技能，装之前问"它安全吗"
  - 团队引入第三方技能前的准入审查
  - 审计自己维护的技能仓库，清理低质与过期技能

# 包内资源
resources:
  - SKILL.md                        # 技能主文件
  - references/audit-criteria.md    # 完整发现分类学与严重度定义
  - scripts/audit_skill.py          # 自动扫描器（支持 text/json 输出）

target_users:
  - 技能市场 / 开源仓库的所有潜在使用者
  - 需要为团队制定技能准入标准的技术负责人
