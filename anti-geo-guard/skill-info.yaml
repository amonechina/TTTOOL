# anti-geo-guard 技能说明

name: anti-geo-guard
display_name: 反GEO搜索净化卫士
version: 1.0.0
category: research-integrity

description: >
  在 AI 搜索与问答过程中自动识别、标记并排除"GEO 营销内容"
  （Generative Engine Optimization / LLM 塞料 / AI-SEO——专为被 AI 引用
  而优化的营销文），让答案建立在独立可信证据之上。

problem_solved: >
  2026 年营销行业已把"被 AI 引用"作为核心投放渠道（GEO/LLM seeding）：
  软文伪装成测评、水军好评刷社区、新闻稿多站洗稿制造"独立报道"假象、
  无出处的统计数字被 AI 反复转引。用户搜索"最好的 X"时，得到的答案
  很可能是付费投放的产物，且无从分辨。本技能在"搜索结果到达"与
  "结果进入答案"之间强制插入一道筛查闸门。

capabilities:
  - 对每个候选来源做 T1–T5 五级可信度分诊（一手/独立/社区/商业博客/GEO 优化）
  - geo_scan.py 静态扫描：7 类信号（极限词饱和、返利链接、水军话术、
    软文洗稿、无出处统计、LLM 塞料指纹、商业 CTA），输出风险分与逐条证据
  - 判定为 GEO 的来源直接排除出证据链，而非降权——禁止"平均掉"营销噪音
  - 仅营销来源才有的结论，在答案中明确标注"该说法只能溯源到营销内容"
  - 答案末尾自动附来源出处行：用了几个、排除了几个、为什么
  - 边界内容（社区帖/商业博客）打折规则：须有一手或独立来源佐证才可用

when_to_use:
  - 网络调研、写报告、做采购/技术选型决策
  - "最好的 X 是什么""X 和 Y 哪个好""推荐一个工具"
  - 引用搜索结果回答事实性问题
  - 深读前批量筛一遍候选来源
  - 中文触发词：识别营销内容、排除营销、反GEO、搜索结果净化、这来源可信吗

resources:
  - SKILL.md：分诊→标记→排除→披露四步工作流
  - references/geo-signals.md：8 类 GEO 手法目录（LLM塞料/返利农场/水军/洗稿/无出处数据/互引环/极限词/时效波），含识别要点
  - scripts/geo_scan.py：静态扫描器，exit 0=干净 / 1=可疑 / 2=判定GEO
  - assets/exclusion-report.template.md：排除报告模板（决策可审计）

target_users:
  - 用 AI 做调研、需要结果可信的用户
  - 内容/市场分析师、采购决策者
  - 关心 AI 搜索被商业操纵的研究人员
