# ============================================================
# 技能说明文件 — skill-from-workflow
# ============================================================
name: skill-from-workflow
display_name: 经验封装器（Workflow → Skill 访谈式封装）
version: "1.0.0"
category: 知识管理 / 团队协作
language: 中英双语资源 / bilingual

# 一句话简介
description: >-
  通过结构化访谈把专家个人的重复工作流封装成团队可分发的
  SKILL.md 技能包：提取隐性判断（例外情形、"一眼不对"的信号、
  质量标准）固化为决策表，再用可移交性检查确保技能在作者本人
  不在场时也能正确运行。

# 解决了什么问题
problem_solved: >-
  企业里最难复制的不是流程文档，而是老员工脑子里的判断力——
  什么情况走例外、哪行数据一看就不对、客户这句话的真实诉求。
  这些东西说不清道不明，过去只能师徒口传，人一走就散；
  团队"只有超级个体，形成效率孤岛"，个人提效无法转化为
  组织能力。文档写了新人照样做错，因为真正的方法在嘴上。
  本技能把"反复用到、能步骤化描述的经验"固化下来，完成
  从个人经验到组织资产的转化。

# 能为用户做什么
capabilities:
  - 三轮结构化访谈提取隐性知识：要故事不要流程（"上次怎么
    出错的"）、逼问每个判断动词的操作化标准、捕获拒绝与上报
    条件、对比样例逼近判断边界
  - 中英双语提问清单与访谈技巧：含 13 个分轮问题、5 种访谈
    失败模式的对策（专家念 SOP / 全说"凭经验" / 访谈疲劳等）
  - 规格书签字确认门禁：专家逐节确认后才打包——未确认的
    规格会打包出"自信但错误"的技能，比没有更糟
  - 打包规范：判断固化为"信号→条件→动作"决策表而非
    "凭感觉"话术；真实成品作标注样例；拒绝条件原文保留
  - package_review.py 可移交性检查器：检出作者依赖话术、
    个人机器路径、缺失样例、缺失拒绝条件、未操作化的判断、
    未展开缩写 6 类问题（实测：问题样例 7 项命中判 REVISE，
    合格样例放行 SHIP）
  - 强制上线前实测：由未参与访谈的人运行技能、专家按质量
    标准打分，通过后才可分发——并要求指名维护人，防止
    技能随流程变更而腐烂

# 典型使用场景
when_to_use:
  - "帮我把做 XX 的方法做成技能" / "turn my workflow into a skill"
  - 新人入职文档总是不够用、真本事在某个人嘴里
  - 团队负责人想把骨干的重复流程变成团队资产（沉淀团队经验）
  - 面向客户定制付费技能：把客户的个人方法论产品化

# 包内资源
resources:
  - SKILL.md                              # 技能主文件（三阶段流程）
  - references/interview-guide.md         # 双语访谈指南与提问清单
  - assets/workflow-spec.template.md      # 规格书模板（阶段二交付物）
  - assets/distribution-readme.template.md # 分发 README 模板
  - scripts/package_review.py             # 可移交性检查器（text/json）

target_users:
  - 团队负责人 / 知识管理负责人（组织经验沉淀）
  - 想把个人方法论产品化的专家与顾问
  - 技能开发者（承接客户"把我的方法做成 AI 技能"的定制需求）
