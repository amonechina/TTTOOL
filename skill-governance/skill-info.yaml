# ============================================================
# 技能说明文件 — skill-governance
# ============================================================
name: skill-governance
display_name: 治理型 Skill 框架（Governed Skill Wrapper）
version: "1.0.0"
category: 可靠性 / 运维治理
language: zh-CN / en

# 一句话简介
description: >-
  为任意 AI 智能体技能或自动化工作流添加"信任包装"：权限清单、
  审批门、失败恢复计划、回滚程序与审计日志，让技能从"能演示"
  变成"可托付"。

# 解决了什么问题
problem_solved: >-
  2026 年智能体市场最普遍的抱怨不是"做不到"，而是"不敢用"：
  技能跑到一半失败后无法恢复、不知道它动了哪些文件和凭证、
  不可逆操作没有任何拦截、事后无法审计。本技能把这四个问题
  一次性规范化，弥合"模型能力"与"生产可用"之间缺失的运营层。

# 能为用户做什么
capabilities:
  - 生成权限清单（permission manifest）：声明技能可读写哪些目录、
    可访问哪些网络与服务，默认拒绝未声明的一切
  - 建立三级审批门：auto（自动执行）/ confirm（行内确认）/
    manual（人工签核），不可逆操作强制走 manual
  - 生成失败恢复与回滚计划：每个危险操作都有前置状态备份、
    失败信号、精确回滚步骤和硬性急停开关
  - 插入审计日志钩子：每次受控操作前后各留一条证据日志，
    定时/无头运行时先读日志尾部，上次运行未解决则拒绝启动
  - 提供 governance_lint.py 校验器：自动检查治理层完整性，
    包括"不可逆操作未挂 manual 门"等规则

# 典型使用场景
when_to_use:
  - 新技能会写文件、调外部 API、用凭证或发消息时
  - 技能要上定时任务、无人值守或生产环境时
  - 用户问"让智能体做这件事安全吗"时

# 包内资源
resources:
  - SKILL.md                # 技能主文件
  - references/governance-guide.md   # 详细治理指南与反模式
  - assets/permission-manifest.template.yaml  # 权限清单模板
  - assets/rollback-plan.template.md          # 回滚计划模板
  - scripts/governance_lint.py                # 治理层校验器

target_users:
  - 想把技能用于生产/团队环境的运营者
  - 需要向安全评审说明技能边界的开发者
